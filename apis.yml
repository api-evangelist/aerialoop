name: Aerialoop
description: Aerialoop is a drone technology and urban logistics company that designs, builds, and
  operates intelligent aerial networks for cargo delivery, surveillance, and infrastructure inspection.
  Founded in 2020 and headquartered in Miami with operations rooted in Quito, Ecuador, it is one of the
  fastest-growing drone delivery operations in Latin America. Its ALT 6-8 delivery drone carries a 5kg
  payload for urban logistics, while the ALT 6-ISR line adds HD, infrared, and night-vision cameras with
  AI-powered intrusion detection; extended-range variants operate up to 120km using LEO satellite
  connectivity for beyond-visual-line-of-sight flights. The company has completed over 50,000 flights
  across six countries. Aerialoop is a Techstars Miami (powered by J.P. Morgan) portfolio company. It
  currently publishes no public developer API, documentation, or SDKs.
